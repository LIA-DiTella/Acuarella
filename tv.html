<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acuarella · Tele</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #e8f7fb; cursor: none;
    font: 20px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #estado { position: fixed; left: 32px; right: 32px; bottom: 24px; color: #8fb3bf; }
  #emparejar { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; background: #052a3d; }
  #emparejar p { margin: 8px 24px; color: #8fb3bf; }
  #codigo { font: 700 160px/1.1 ui-monospace, Menlo, monospace; letter-spacing: .12em; color: #29f0ff; margin: 12px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<div id="estado" hidden></div>
<div id="emparejar" hidden>
  <p>Código de esta tele</p>
  <div id="codigo"></div>
  <p>Ingresalo en el panel del acuario, en «Transmitir a la tele».</p>
</div>
<script type="module">
  import { recibir, esperarEmparejamiento, nuevoCodigo, secretoValido } from './stream.js';

  // La tele se empareja una vez: muestra un código de 3 cifras y el emisor le manda un secreto largo, que guarda.
  // Con el secreto guardado no vuelve a mostrar ningún código. tv.html#nuevo la desempareja.
  const GUARDADO = 'acuarella-tele';
  const leer = () => {
    try { return JSON.parse(localStorage.getItem(GUARDADO) || 'null'); } catch (e) { return null; }
  };
  const guardar = (d) => {
    try { localStorage.setItem(GUARDADO, JSON.stringify(d)); } catch (e) { /* sin almacenamiento: se empareja cada vez */ }
  };

  const video = document.getElementById('video');
  const estado = document.getElementById('estado');
  const emparejar = document.getElementById('emparejar');

  const TEXTOS = {
    esperando: 'Esperando la transmisión…',
    conectando: 'Conectando…',
    bloqueada: 'La computadora responde pero no se puede conectar directo. Revisá que la tele y la computadora ' +
      'estén en la misma red Wi-Fi y el ajuste de Chrome que indica el panel. Sigo intentando…',
    conectado: '',
    reconectando: 'Se cortó la transmisión, reconectando…',
  };

  function transmitir(secreto) {
    emparejar.hidden = true;
    estado.hidden = false;
    recibir(video, secreto, (s) => {
      estado.textContent = TEXTOS[s];
      estado.hidden = s === 'conectado';
    });
  }

  function mostrarCodigo() {
    const codigo = nuevoCodigo();
    document.getElementById('codigo').textContent = codigo;
    emparejar.hidden = false;
    esperarEmparejamiento(codigo, (secreto) => {
      guardar({ secreto });
      transmitir(secreto);
    });
  }

  if (location.hash === '#nuevo') {
    guardar(null);
    history.replaceState(null, '', location.pathname);
  }
  const datos = leer();
  if (datos && secretoValido(datos.secreto)) transmitir(datos.secreto);
  else mostrarCodigo();

  // Con el control remoto, cualquier tecla pasa a pantalla completa.
  const completa = () => {
    const el = document.documentElement;
    const p = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null;
    if (p && p.catch) p.catch(() => {});
  };
  document.addEventListener('click', completa);
  document.addEventListener('keydown', completa);
</script>
</body>
</html>
