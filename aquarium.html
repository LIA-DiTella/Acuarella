<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#052a3d">
<title>DiTella Acuario</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐠</text></svg>">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #052a3d; color: #e8f7fb; font: 14px/1.5 system-ui, -apple-system, sans-serif; }
  #sea { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(120% 90% at 50% 20%, #0b4a63, #052a3d 70%); text-align: center; padding: 24px;
  }
  #loading .bar { width: min(280px, 70vw); height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .2); overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #29f0ff; transition: width .2s linear; }
  #debug {
    position: fixed; left: calc(env(safe-area-inset-left, 0px) + 12px); top: calc(env(safe-area-inset-top, 0px) + 44px);
    max-width: calc(100% - 24px); max-height: calc(80vh - 32px); overflow: auto;
    margin: 0; padding: 8px 10px; border-radius: 8px; background: rgba(0, 20, 40, .6); color: #e8f7fb;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre;
  }
  #creature-count {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: calc(env(safe-area-inset-left, 0px) + 12px);
    padding: 4px 7px; border-radius: 5px; background: rgba(0, 20, 40, .6); color: #e8f7fb;
    font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none;
  }
  #fps {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: calc(env(safe-area-inset-right, 0px) + 12px);
    padding: 4px 7px; border-radius: 5px; background: rgba(0, 20, 40, .6); color: #e8f7fb;
    font: 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; pointer-events: none;
  }
  [hidden] { display: none !important; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/jsm/" } }
</script>
</head>
<body>
<canvas id="sea"></canvas>
<div id="loading">Cargando el arrecife…<div class="bar"><i id="progress"></i></div></div>
<div id="creature-count" aria-label="Cantidad de criaturas">🐟 0</div>
<div id="fps" aria-label="Cuadros por segundo y calidad gráfica"></div>
<pre id="debug" hidden></pre>
<script type="module" src="aquarium.js"></script>
</body>
</html>
