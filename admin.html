<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#052a3d">
<title>Acuarella · Panel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗑️</text></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #052a3d; color: #e8f7fb;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 22px; }
  a { color: #29f0ff; }
  .sub { color: #8fb3bf; font-size: 13px; margin: 0 0 16px; }
  .barra { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  button {
    border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .08); color: inherit;
    border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 600;
  }
  button.peligro { border-color: #ff8a8a; color: #ffd7d7; }
  button:disabled { opacity: .45; }
  #estado { color: #8fb3bf; font-size: 13px; min-height: 1.4em; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  li { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid rgba(255, 255, 255, .18); border-radius: 12px; background: rgba(0, 0, 0, .25); }
  li img { width: 96px; height: 62px; object-fit: contain; background: rgba(255, 255, 255, .06); border-radius: 8px; flex: none; }
  .datos { flex: 1; min-width: 0; }
  .nombre { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: #8fb3bf; font-size: 12px; }
  .fijo { color: #ffd23f; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Panel del acuario</h1>
  <a href="aquarium.html">ver acuario</a>
  <a href="./">ir a escanear</a>
</header>
<p class="sub">Borra escaneos de la base: el pez desaparece del acuario en la próxima sincronización (hasta 20 s). El archivo PNG queda guardado en Storage.</p>

<div class="barra">
  <button id="recargar">Recargar</button>
  <button id="borrarTodos" class="peligro">Borrar todos los visitantes</button>
  <span id="estado"></span>
</div>

<ul id="lista"></ul>

<script type="module" src="admin.js"></script>
</body>
</html>
